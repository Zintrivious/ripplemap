name: Missed or wrong dependency
description: ripplemap missed a reference, linked the wrong repo, or misread a file
labels: [bug]
body:
  - type: textarea
    id: file
    attributes:
      label: The file
      description: The smallest snippet that shows the problem, with its path (e.g. infra/main.tf).
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What ripplemap printed
      render: text
  - type: input
    id: version
    attributes:
      label: ripplemap version
      placeholder: ripplemap --version
